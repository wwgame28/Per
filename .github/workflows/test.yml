name: Go checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
      - run: go mod verify
      - run: go test -race -timeout 90s ./...
      - run: go vet ./...
      - run: go build ./...
      - run: sh -n start.sh
